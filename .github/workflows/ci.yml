# Continuous integration (free on GitHub Actions within the free minutes allowance).
# Every push and pull request: static checks, database integrity on real PostgreSQL,
# and the browser test suites against a production build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # Fails on known vulnerabilities in packages that ship to production.
      - run: npm audit --omit=dev --audit-level=moderate

  database:
    name: Migrations + integrity (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eduwave
          POSTGRES_PASSWORD: eduwave
          POSTGRES_DB: eduwave_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduwave" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://eduwave:eduwave@localhost:5432/eduwave_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      # Applying twice must be a no-op (migrations are tracked).
      - run: npm run db:migrate
      - run: npm run test:db

  browser:
    name: Browser suites (e2e, stability, security, institution, a11y)
    runs-on: ubuntu-latest
    env:
      EDUWAVE_ENV: local
      BROWSER_CHANNEL: chrome
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USER: test
      SMTP_PASS: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate && npm run db:seed
      - name: Start server
        run: |
          npm start -- -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/login > /dev/null && break; sleep 1; done
      - run: npm run test:e2e
      - run: npm run test:stability
      - run: npm run test:security
      - run: npm run test:institution
      - run: npm run test:a11y
      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 server.log
